# Supply public build arguments using: docker compose --env-file .env.local build
# The application binds loopback. Use a reverse proxy sharing its network namespace
# for container ingress, or select the supported Vercel deployment path.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_STORE_NAME: ${NEXT_PUBLIC_STORE_NAME}
        NEXT_PUBLIC_STORE_SHORT_NAME: ${NEXT_PUBLIC_STORE_SHORT_NAME}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL}
        NEXT_PUBLIC_SUPPORT_PHONE: ${NEXT_PUBLIC_SUPPORT_PHONE}
    env_file: .env.local
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    tmpfs:
      - /tmp
